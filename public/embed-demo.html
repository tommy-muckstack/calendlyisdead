<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Embed demo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:'DM Sans',system-ui,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;color:#14211d}</style></head>
<body>
<h1>Embed demo</h1>
<p>Three ways to put a booking page on any site. <a href="#" id="popup-text" data-cid-popup="/demo/30min">Open the popup</a></p>
<h2>Inline</h2>
<div class="cid-inline" data-url="/demo/30min" style="min-height:700px"></div>
<script src="/embed.js"></script>
<script>
  CalendlyIsDead.initPopupWidget({ url: "/demo/deep-dive", text: "Book a deep dive", color: "#E8692C" });
  window.addEventListener("message", function (e) { if (e.data && e.data.source === "calendlyisdead" && e.data.type === "booked") document.body.setAttribute("data-booked", e.data.uid); });
</script>
</body></html>
